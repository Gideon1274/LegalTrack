services:
  - type: web
    name: LegalTrack
    env: docker
    region: oregon
    plan: starter
    disk:
      name: media
      mountPath: /var/media
      sizeGB: 1

    # No buildCommand or startCommand needed for env: docker
    # as they are handled by the Dockerfile, but we can keep
    # envVars for Django configuration.

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: legaltrack.settings
      - key: DJANGO_MEDIA_ROOT
        value: /var/media
